name: Validate theme
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo: ["0.168.0", "0.169.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        env:
          HUGO_VERSION: ${{ matrix.hugo }}
        run: |
          release="https://github.com/gohugoio/hugo/releases/download"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/hugo.tar.gz" \
            "$release/v${HUGO_VERSION}/$archive"
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Validate example and JavaScript
        run: python3 scripts/check.py
