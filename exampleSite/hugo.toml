baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Dockleaf Documentation'
theme = 'dockleaf'
[params]
  brand = 'Dockleaf'
  description = 'A lightweight dark documentation theme for Hugo.'
  footer = 'Built with [Dockleaf](https://github.com/coolapso/dockleaf).'
[[menus.main]]
  name = 'Get started'
  pageRef = '/guide/getting-started'
  weight = 1
[[menus.main]]
  name = 'Configuration'
  pageRef = '/guide/configuration'
  weight = 2
[[menus.footer]]
  name = 'Hugo'
  url = 'https://gohugo.io/'

[outputs]
  home = ["HTML", "JSON"]
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  style = "onedark"
  lineNos = true
